# PenAI ({{INSTANCE}}) — tạo bởi deploy/install.sh. certbot tự thêm phần HTTPS.
map $http_upgrade ${{NGINX_ID}}_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    # File tải lên tối đa 100 MB, gửi dạng base64 nên thân request lớn hơn ~1/3
    client_max_body_size 150m;

    location / {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection ${{NGINX_ID}}_connection;
        # Chat trả lời dạng stream (SSE) + agent chạy lâu → không đệm, chờ lâu
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
